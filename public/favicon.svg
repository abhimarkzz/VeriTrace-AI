<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="vtNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2842" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>
    <linearGradient id="vtBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E78E8" />
      <stop offset="100%" stop-color="#145EBD" />
    </linearGradient>
    <linearGradient id="vtTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2CD49E" />
      <stop offset="50%" stop-color="#20B486" />
      <stop offset="100%" stop-color="#17926C" />
    </linearGradient>
    <linearGradient id="vtRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2CD49E" />
      <stop offset="50%" stop-color="#1E78E8" />
      <stop offset="100%" stop-color="#0E2842" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#071422" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Badge Base -->
  <circle cx="256" cy="256" r="240" fill="url(#vtNavyGrad)" filter="url(#softShadow)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#vtRingGrad)" stroke-width="8" />

  <!-- Inner Verification Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1769D5" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#20B486" stroke-opacity="0.3" stroke-width="2.5" />

  <!-- Network Evidence Lines -->
  <g stroke="url(#vtBlueGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="96" x2="256" y2="176" />
    <line x1="256" y1="336" x2="256" y2="416" />
    <line x1="118" y1="176" x2="196" y2="220" />
    <line x1="394" y1="176" x2="316" y2="220" />
    <line x1="118" y1="336" x2="196" y2="292" />
    <line x1="394" y1="336" x2="316" y2="292" />
    <line x1="118" y1="256" x2="176" y2="256" />
    <line x1="336" y1="256" x2="394" y2="256" />
  </g>

  <!-- Evidence Outer Nodes -->
  <g fill="#1769D5">
    <circle cx="256" cy="96" r="14" fill="#20B486" />
    <circle cx="256" cy="96" r="6" fill="#F7F7F2" />
    <circle cx="256" cy="416" r="14" fill="#1769D5" />
    <circle cx="256" cy="416" r="6" fill="#F7F7F2" />
    <circle cx="118" cy="176" r="14" fill="#1769D5" />
    <circle cx="118" cy="176" r="6" fill="#F7F7F2" />
    <circle cx="394" cy="176" r="14" fill="#20B486" />
    <circle cx="394" cy="176" r="6" fill="#F7F7F2" />
    <circle cx="118" cy="336" r="14" fill="#1769D5" />
    <circle cx="118" cy="336" r="6" fill="#F7F7F2" />
    <circle cx="394" cy="336" r="14" fill="#1769D5" />
    <circle cx="394" cy="336" r="6" fill="#F7F7F2" />
  </g>

  <!-- Central Evidence Diamond with Glow -->
  <g filter="url(#glow)">
    <polygon points="256,166 346,256 256,346 166,256" fill="url(#vtTealGrad)" />
    <polygon points="256,196 316,256 256,316 196,256" fill="#0B1F33" opacity="0.4" />
    <polygon points="256,220 292,256 256,292 220,256" fill="#F7F7F2" />
  </g>

  <!-- Stylized Verification Check Core -->
  <path d="M236 256 L250 270 L282 238" fill="none" stroke="#0B1F33" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>